buildscript {
    ext {
        def hasOptional = { key, defaultValue -> rootProject.hasProperty(key) ? rootProject[key] : defaultValue }

        newrelic = [
                version: hasOptional('newrelic.version', '+'),
                agent  : [
                        version : hasOptional('newrelic.agent.version', '+'),
                        snapshot: hasOptional('newrelic.agent.snapshot', null),
                ]
        ]

        newrelic.deps = [
                ndk   : "com.newrelic.agent.android:agent-ndk:" + newrelic.version,
                agent : "com.newrelic.agent.android:android-agent:" + newrelic.agent.version,
                plugin: "com.newrelic.agent.android:agent-gradle-plugin:" + newrelic.agent.version
        ]

        versions = [
                test     : [
                        junit       : '4.13.2',
                        mockitoCore : '2.28.2',
                        robolectric : '4.16',
                        androidxCore: '1.4.+',
                        owasp       : '8.1.2',
                        jacoco      : '0.8.11',
                ],
                kotlin   : [
                        plugin : "2.0.21",
                        ktx    : "1.3.2",
                        mockito: "3.2.0"
                ],
                agp      : [
                        // https://developer.android.com/studio/releases/platforms
                        plugin    : hasOptional('newrelic.agp.version', '8.9.3'),
                        minSdk    : 24, // Android 7
                        compileSdk: 36, // Android 16
                        targetSdk : 36, // Android 16
                        buildTools: '36.0.0',
                        ndk       : '25.1.8937393',
                        cmake     : '3.22.1'
                ],
                libraries: [
                        rootbeer: '0.1.1',
                ],
                java     : [
                        nexus: '1.1.0',
                ],
        ]

        newrelic.agent.snapshotUri = uri("https://ossrh-staging-api.central.sonatype.com/content/repositories/comnewrelic-$newrelic.agent.snapshot")
    }

    repositories {
        maven { url newrelic.agent.snapshotUri }
        mavenLocal()
        mavenCentral()
    }
}


subprojects {
    ext.newrelic = rootProject.newrelic

    buildscript {
        repositories {
            maven { url newrelic.agent.snapshotUri }
            mavenLocal()
            mavenCentral()
            google()
        }

        dependencies {
            //noinspection DependencyNotationArgument
            classpath newrelic.deps.plugin
        }
    }

    repositories {
        maven { url newrelic.agent.snapshotUri }
        mavenLocal()
        mavenCentral()
        google()
    }
}
